<style>

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;margin:0;min-width:90px}.row select{width:auto;margin:0}

.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#F2B544}

.op{display:block;width:100%;text-align:left;margin-top:8px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
.au{max-width:900px;margin:40px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.au ul{list-style:none;padding:0}.au li{display:flex;gap:10px;margin:12px 0;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:9px;border:0;background:var(--bg);color:var(--ink);border-radius:10px;font:inherit;cursor:pointer}.tabs .on{background:#F2B544;color:#1F3A5F;font-weight:600}
.ck{display:flex;gap:8px;align-items:center;margin-bottom:10px}.ck input{width:auto;margin:0}.er{color:var(--er);min-height:20px}
.vw{position:relative;background:#0d1424;border-radius:12px;aspect-ratio:16/9;overflow:hidden;margin-bottom:10px}.vw video{width:100%;height:100%;object-fit:cover}.nc{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#cfd8ea}
.lb{position:absolute;left:10px;top:10px;background:#b42318;color:#fff;padding:2px 10px;border-radius:6px;font-weight:600;font-size:12px}.vc{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;padding:2px 10px;border-radius:6px}
.chat{max-height:160px;overflow:auto;background:var(--bg);border-radius:10px;padding:8px 12px;margin:10px 0}.dt{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--ln);margin-right:6px}.dt.f{background:#b42318}
#md{position:fixed;inset:0;background:rgba(10,18,35,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#md.on{display:flex}.mb{background:var(--cd);border-radius:16px;padding:22px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.ts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1F3A5F;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}
@media(max-width:900px){.w{grid-template-columns:1fr;margin-bottom:84px}aside{display:none}.au{grid-template-columns:1fr}.nv{position:fixed;top:auto;bottom:0;left:0;right:0;flex-direction:row;background:var(--cd);border-top:1px solid var(--ln);z-index:6;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));overflow-x:auto}.nv button span{display:none}}

<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><symbol id="home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></symbol><symbol id="live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M7 7a7 7 0 000 10M17 7a7 7 0 010 10M4 4a11 11 0 000 16M20 4a11 11 0 010 16"/></symbol><symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 010 7M22 20c0-3-2-5-4-5.5"/></symbol><symbol id="store" viewBox="0 0 24 24"><path d="M4 9l1-5h14l1 5M5 9v11h14V9M4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0A2.7 2.7 0 0020 9"/></symbol><symbol id="game" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 10v5M4.5 12.5h5M16 11h.01M18 14h.01"/></symbol><symbol id="shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol><symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 010 3h-3a1.5 1.5 0 000 3h4"/></symbol><symbol id="img" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 18l6-5 4 3 3-2 5 4"/></symbol><symbol id="video" viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></symbol><symbol id="heart" viewBox="0 0 24 24"><path d="M12 21C5 15 3 11 3 8a4.5 4.5 0 019-1 4.5 4.5 0 019 1c0 3-2 7-9 13z"/></symbol><symbol id="chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol><symbol id="share" viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol><symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4h12l-2 4 2 4H5"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol><symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol></svg>
<div id="app"></div><div id="md"></div>
<script>
const $=s=>document.querySelector(s),H=$("#app"),DAY=864e5;let V="home",ui={t:"l"},stream=null;
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const I=(n,c="")=>`<svg class="i ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?"ahora":m<60?m+" min":m<1440?(m/60|0)+" h":(m/1440|0)+" d"};
const art=(a,b,k)=>"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220"><rect width="400" height="220" fill="${a}"/><circle cx="${80+k*55}" cy="60" r="90" fill="${b}" opacity=".35"/><circle cx="330" cy="190" r="110" fill="${b}" opacity=".25"/><path d="M0 170Q100 120 200 170T400 150V220H0Z" fill="${b}" opacity=".5"/></svg>`);
const logo=s=>`<svg width="${s}" height="${s}" viewBox="50 30 160 160" role="img" aria-label="Selah"><rect x="50" y="30" width="160" height="160" rx="36" fill="#F2B544"/><g fill="none" stroke="#1F3A5F" stroke-linecap="round"><path stroke-width="14" transform="translate(-10 0)" d="M152 88A22 22 0 1 0 130 110A22 22 0 1 1 108 132"/><path stroke-width="5" d="M154.7 75.3A18 18 0 0 1 154.7 100.7M161.8 68.2A28 28 0 0 1 161.8 107.8"/></g></svg>`;
const av=(n,a)=>a?`<img class="av" src="${a}" alt="">`:`<div class="av">${E((n||"S")[0]).toUpperCase()}</div>`;
const ID=(()=>{try{let d=localStorage.getItem("sid");if(!d){d=Math.random().toString(36).slice(2);localStorage.setItem("sid",d)}return d}catch(e){return"x"}})();
const FP="fp"+[navigator.userAgent,screen.width,screen.height,Intl.DateTimeFormat().resolvedOptions().timeZone].join("|").split("").reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
const seed=()=>({sess:null,users:[],banned:{e:[],d:[]},
comms:[{id:1,n:"Jóvenes en la Palabra",d:"Estudio bíblico semanal y retos de lectura.",p:0,m:1240,o:"Iglesia Vida Nueva",a:["#1F3A5F","#F2B544"]},{id:2,n:"Alabanza y Adoración",d:"Tutoriales, ensayos y arreglos exclusivos.",p:4.99,m:860,o:"Ministerio Shalom",a:["#2d5f7a","#F2B544"]},{id:3,n:"Matrimonios con Propósito",d:"Cursos y mentorías para parejas.",p:9.99,m:410,o:"Pastor Andrés Mejía",a:["#5a3d6b","#F2B544"]}],
posts:[{id:1,uid:0,n:"Iglesia Vida Nueva",vf:1,t:"Hoy comenzamos la serie “Hacer una pausa” en el culto de las 10:00. Los esperamos en vivo y en persona.",img:art("#1F3A5F","#F2B544",1),c:0,l:48,s:6,cm:[],ts:Date.now()-36e5},{id:2,uid:0,n:"Ministerio Shalom",vf:1,t:"Nuevo tutorial exclusivo: acordes y arreglos para el ensayo de esta semana.",img:art("#2d5f7a","#F2B544",2),c:2,l:31,s:2,cm:[],ts:Date.now()-9e6},{id:3,uid:0,n:"Pastor Andrés Mejía",vf:1,t:"Tres hábitos que fortalecen un matrimonio: orar juntos, escuchar sin interrumpir y agradecer cada día.",c:0,l:76,s:14,cm:[],ts:Date.now()-864e5}],
prods:[{id:1,n:"Biblia de estudio, tapa dura",p:24,s:"Librería Aletheia",vf:1,img:art("#1F3A5F","#F2B544",1)},{id:2,n:"Camiseta “Fe y gracia”",p:15,s:"Taller Fe Viva",vf:1,img:art("#2d5f7a","#F2B544",3)},{id:3,n:"Cuadro de versículo",p:18,s:"Taller Fe Viva",vf:1,img:art("#5a3d6b","#F2B544",2)},{id:4,n:"Devocional diario",p:12,s:"Librería Aletheia",vf:1,img:art("#7a5a2d","#1F3A5F",4)}]});
let DB;try{DB=JSON.parse(localStorage.getItem("selah1"))||seed()}catch(e){DB=seed()}
DB.posts.forEach(p=>{if(p.vid&&p.vid[0]=="b")delete p.vid});
const save=()=>{try{localStorage.setItem("selah1",JSON.stringify(DB))}catch(e){toast("Almacenamiento lleno. Usa imágenes más livianas.")}};
const me=()=>DB.users.find(u=>u.id===DB.sess);
function toast(t){const d=document.createElement("div");d.className="ts";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function modal(h){const d=$("#md");d.innerHTML=h?`<div class="mb">${h}</div>`:"";d.classList.toggle("on",!!h)}
const BAD=["idiota","estúpido","maldito","estafa","odio a"],GRAVE=["matar","pornografía","abuso infantil"];
const chk=t=>{t=t.toLowerCase();return GRAVE.some(w=>t.includes(w))?2:BAD.some(w=>t.includes(w))?1:0};
function pick(cb,vid){const f=document.createElement("input");f.type="file";f.accept=vid?"video/*":"image/*";f.onchange=()=>{const x=f.files[0];if(!x)return;if(vid)return cb(URL.createObjectURL(x));const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78))};im.src=r.result};r.readAsDataURL(x)};f.click()}
const NAV=[["home","home","Inicio"],["live","live","En vivo"],["comms","users","Comunidades"],["games","game","Juegos"],["market","store","Mercado"],["money","coin","Monetización"],["norms","shield","Normas"],["profile","user","Perfil"]];
const go=k=>{V=k;render();scrollTo(0,0)};
function auth(){const r=ui.t=="r";return `<div class="au"><section>${logo(64)}<h1 style="margin-top:14px">Selah</h1><p style="font-size:18px">Haz una pausa. Conecta con Dios y con tu comunidad.</p><ul>${[["shield","Comunidad moderada con normas claras"],["lock","Contenido exclusivo y pagos protegidos"],["live","Transmisiones en vivo para tu iglesia"]].map(x=>`<li>${I(x[0])}${x[1]}</li>`).join("")}</ul></section><section class="cd"><div class="tabs"><button class="${r?"":"on"}" onclick="ui.t='l';render()">Ingresar</button><button class="${r?"on":""}" onclick="ui.t='r';render()">Crear cuenta</button></div>${r?`<input id="n" placeholder="Nombre completo">`:""}<input id="e" type="email" placeholder="Correo electrónico"><input id="p" type="password" placeholder="Contraseña"><label class="ck">${r?`<input type="checkbox" id="ok"> Acepto las normas y lineamientos de la comunidad`:""}</label><p id="er" class="er"></p><button class="b" style="width:100%" onclick="${r?"reg()":"log()"}">${r?"Crear cuenta":"Ingresar"}</button></section></div>`}
function reg(){const n=$("#n").value.trim(),e=$("#e").value.trim().toLowerCase(),p=$("#p").value,er=x=>$("#er").textContent=x;
if(!n||!/^\S+@\S+\.\S+$/.test(e)||p.length<6)return er("Completa tu nombre, un correo válido y una contraseña de 6 o más caracteres.");
if(!$("#ok").checked)return er("Debes aceptar las normas de la comunidad.");
if(DB.banned.e.includes(e))return er("Este correo fue bloqueado de forma permanente.");
if(DB.banned.d.some(d=>d==FP||d==ID))return er("Detectamos que este dispositivo pertenece a una cuenta eliminada. No es posible crear otra cuenta.");
if(DB.users.some(u=>u.e==e))return er("Ese correo ya está registrado.");
const u={id:Date.now(),n,e,pw:btoa(p),bio:"",av:null,bn:null,f:0,sc:0,until:0,subs:[],ow:[],fx:0,mon:0,earn:{tips:0,subs:0,sales:0}};DB.users.push(u);DB.sess=u.id;save();V="home";render()}
function log(){const e=$("#e").value.trim().toLowerCase(),p=$("#p").value,er=x=>$("#er").textContent=x;
if(DB.banned.e.includes(e))return er("Esta cuenta fue eliminada por incumplir gravemente las normas.");
const u=DB.users.find(x=>x.e==e&&x.pw==btoa(p));if(!u)return er("Correo o contraseña incorrectos.");
if(u.until>Date.now())return er("Cuenta suspendida hasta el "+new Date(u.until).toLocaleDateString("es")+".");
DB.sess=u.id;save();V="home";render()}
const out=()=>{DB.sess=null;save();render()};
function strike(k,w){const m=me();if(k==2)return ban(m,"Falta grave detectada en tu "+w+".");
m.f++;if(m.f%3){save();return modal(`<h2>Falta ${m.f%3} de 3</h2><p>Tu ${w} incumple las normas de la comunidad y no fue publicado. Al llegar a 3 faltas tu cuenta será suspendida.</p><button class="b" onclick="modal()">Entendido</button>`)}
const t=m.sc++;if(t>3)return ban(m,"Reincidencia tras la suspensión de 1 año.");
const mo=[1,3,6,12][t];m.until=Date.now()+mo*30*DAY;DB.sess=null;save();render();
modal(`<h2>Cuenta suspendida</h2><p>Acumulaste 3 faltas. Tu cuenta queda suspendida por <b>${mo==12?"1 año":mo+(mo==1?" mes":" meses")}</b>. Una nueva reincidencia aumentará la sanción.</p><button class="b" onclick="modal()">Cerrar</button>`)}
function ban(m,w){DB.banned.e.push(m.e);DB.banned.d.push(FP,ID);DB.users=DB.users.filter(u=>u!==m);DB.posts=DB.posts.filter(p=>p.uid!=m.id);DB.sess=null;save();render();modal(`<h2>Cuenta eliminada</h2><p>${w} Tu cuenta fue eliminada de forma permanente. Este correo y este dispositivo quedan bloqueados, y el sistema detecta los intentos de crear cuentas nuevas.</p><button class="b" onclick="modal()">Cerrar</button>`)}
function card(p){const m=me(),c=DB.comms.find(x=>x.id==p.c),u=DB.users.find(x=>x.id==p.uid),lock=c&&c.p>0&&!m.subs.includes(c.id)&&p.uid!=m.id&&!m.ow.includes(c.id);
return `<article class="cd"><div class="ph">${av(p.n,u&&u.av)}<div><b>${E(p.n)}</b>${p.vf?I("shield","vf"):""}<small>${ago(p.ts)}${c?" · "+E(c.n):""}</small></div></div>${lock?`<div class="lk">${I("lock")}<p>Contenido exclusivo para suscriptores de <b>${E(c.n)}</b></p><button class="b" onclick="sub(${c.id})">Suscribirme · US$${c.p}/mes</button></div>`:`<p>${E(p.t)}</p><div class="mw">${p.img?`<img src="${p.img}" alt="">`:""}${p.vid?`<video src="${p.vid}" controls></video>`:""}</div>`}<div class="ac"><button onclick="lk(${p.id})">${I("heart")} ${p.l}</button><button onclick="cmt(${p.id})">${I("chat")} ${p.cm.length}</button><button onclick="shr(${p.id})">${I("share")} ${p.s}</button><button onclick="toast('Reporte enviado al equipo de moderación.')" aria-label="Reportar">${I("flag")}</button></div><div id="c${p.id}"></div></article>`}
const lk=id=>{DB.posts.find(x=>x.id==id).l++;save();render()};
function shr(id){DB.posts.find(x=>x.id==id).s++;save();try{navigator.clipboard.writeText(location.href)}catch(e){}toast("Publicación compartida. Enlace copiado.");render()}
function cmt(id){const p=DB.posts.find(x=>x.id==id),d=$("#c"+id);if(d.innerHTML){d.innerHTML="";return}d.innerHTML=p.cm.map(c=>`<p class="cm"><b>${E(c.n)}</b> ${E(c.t)}</p>`).join("")+`<div class="row" style="margin-top:8px"><input id="ci${id}" placeholder="Escribe un comentario respetuoso"><button class="b" onclick="addc(${id})">Enviar</button></div>`}
function addc(id){const t=$("#ci"+id).value.trim();if(!t)return;const k=chk(t);if(k)return strike(k,"comentario");DB.posts.find(x=>x.id==id).cm.push({n:me().n,t});save();render();cmt(id)}
function att(k){pick(d=>{k=="i"?ui.i=d:ui.v=d;$("#pv").innerHTML=(ui.i?`<div class="mw"><img src="${ui.i}" alt=""></div>`:"")+(ui.v?`<p class="tag">Video adjunto</p>`:"")},k=="v")}
function post(){const m=me(),t=$("#pt").value.trim();if(!t&&!ui.i&&!ui.v)return toast("Escribe algo o adjunta un archivo.");const k=chk(t);if(k)return strike(k,"publicación");
DB.posts.unshift({id:Date.now(),uid:m.id,n:m.n,vf:0,t,img:ui.i,vid:ui.v,c:+$("#ps").value||0,l:0,s:0,cm:[],ts:Date.now()});ui.i=ui.v=null;save();render()}
function sub(id){const c=DB.comms.find(x=>x.id==id),m=me();if(!c.p){m.subs.push(id);c.m++;save();return render()}
modal(`<h2>Suscripción a ${E(c.n)}</h2><p>US$${c.p} al mes. Cancela cuando quieras. Pago protegido.</p><input placeholder="Nombre en la tarjeta"><input placeholder="Número de tarjeta" inputmode="numeric"><div class="row" style="margin-bottom:10px"><input placeholder="MM/AA"><input placeholder="CVC"></div><button class="b" style="width:100%" onclick="paid(${id})">Pagar US$${c.p}</button><p><small>Demostración: no se realiza ningún cobro real.</small></p>`)}
function paid(id){DB.comms.find(x=>x.id==id).m++;me().subs.push(id);save();modal();toast("Suscripción activada");render()}
function simsub(id){const c=DB.comms.find(x=>x.id==id);c.m++;me().earn.subs+=c.p*.9;save();render();toast("Nuevo suscriptor")}
function mk(){const n=$("#cn").value.trim(),p=+$("#cp").value||0,m=me();if(!n)return toast("Escribe un nombre.");const id=Date.now();DB.comms.push({id,n,d:"Comunidad creada por "+m.n,p,m:0,o:m.n,a:["#1F3A5F","#F2B544"]});m.ow.push(id);save();render()}
const QZ=[["¿Quién construyó el arca?",["Moisés","Noé","Abraham"],1],["¿Cuántos discípulos eligió Jesús?",["7","12","40"],1],["¿Cuál es el primer libro de la Biblia?",["Éxodo","Salmos","Génesis"],2],["¿Quién derrotó a Goliat?",["David","Sansón","Saúl"],0],["¿En qué ciudad nació Jesús?",["Nazaret","Belén","Jerusalén"],1],["¿Quién fue tragado por un gran pez?",["Jonás","Pedro","Elías"],0]];
function ans(j){const g=ui.g,q=QZ[g.i];if(j==q[2]){g.s++;toast("Correcto")}else toast("Incorrecto. Respuesta: "+q[1][q[2]]);g.i++;render()}
function buy(id){const p=DB.prods.find(x=>x.id==id);modal(`<h2>${E(p.n)}</h2><p>US$${p.p} · Vendedor: ${E(p.s)}</p><p class="mu">Compra protegida: el pago se libera al vendedor cuando confirmas la recepción.</p><button class="b" style="width:100%" onclick="modal();toast('Pedido realizado (demo)')">Confirmar compra</button>`)}
function sell(){const n=$("#mn").value.trim(),p=+$("#mp").value,m=me();if(!n||!p)return toast("Completa nombre y precio.");DB.prods.unshift({id:Date.now(),n,p,s:m.n,vf:0,img:ui.pi||art("#1F3A5F","#F2B544",5)});ui.pi=null;save();render()}
function goLive(){ui.lv=1;ui.vn=1;ui.ch=[["Selah","Bienvenidos. Recuerda respetar las normas de la comunidad."]];const run=()=>{render();ui.tm=setInterval(()=>{ui.vn+=Math.random()*3|0;const n=$("#vn");if(n)n.textContent=ui.vn},3000)};
navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?navigator.mediaDevices.getUserMedia({video:1,audio:1}).then(s=>{stream=s;run()}).catch(()=>{ui.nc=1;run()}):(ui.nc=1,run())}
function endLive(){clearInterval(ui.tm);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}ui.lv=0;ui.nc=0;render()}
function lsend(){const t=$("#lm").value.trim();if(!t)return;const k=chk(t);if(k)return strike(k,"mensaje de chat");ui.ch.push([me().n,t]);render()}
function tip(v){me().earn.tips+=v;ui.ch.push(["Selah","Recibiste una propina de US$"+v+". Gracias, comunidad."]);save();render()}
const VIEWS={
home(){const m=me();return `<div class="cd"><textarea id="pt" rows="3" placeholder="Comparte una reflexión, un testimonio o una petición de oración"></textarea><div id="pv"></div><div class="row"><button class="b2" onclick="att('i')">${I("img")} Imagen</button><button class="b2" onclick="att('v')">${I("video")} Video</button><select id="ps" aria-label="Destino"><option value="0">Público</option>${m.ow.map(id=>`<option value="${id}">${E(DB.comms.find(c=>c.id==id).n)} (exclusivo)</option>`).join("")}</select><button class="b" onclick="post()" style="margin-left:auto">Publicar</button></div></div>`+DB.posts.map(card).join("")},
live(){return ui.lv?`<div class="cd"><div class="vw">${ui.nc?`<div class="nc">${logo(56)}<p>Vista previa simulada: la cámara no está disponible aquí.</p></div>`:`<video id="lv" autoplay muted playsinline></video>`}<span class="lb">EN VIVO</span><span class="vc">${I("users")} <i id="vn" style="font-style:normal">${ui.vn}</i></span></div><div class="row"><button class="b2" onclick="tip(1)">Propina US$1</button><button class="b2" onclick="tip(5)">US$5</button><button class="b2" onclick="tip(10)">US$10</button><button class="b" style="margin-left:auto;background:#b42318;color:#fff" onclick="endLive()">Finalizar</button></div><div class="chat">${ui.ch.map(c=>`<p><b>${E(c[0])}</b> ${E(c[1])}</p>`).join("")}</div><div class="row"><input id="lm" placeholder="Escribe en el chat"><button class="b" onclick="lsend()">Enviar</button></div></div>`:`<div class="cd"><h2>Transmite a tu comunidad</h2><p class="mu">Inicia una transmisión con tu cámara. Tus seguidores chatean y pueden enviarte propinas.</p><button class="b" onclick="goLive()">${I("live")} Iniciar transmisión</button></div>`},
comms(){const m=me();return `<div class="cd"><h2>Comunidades</h2><p class="mu">Únete a espacios de fe. Los creadores ofrecen contenido exclusivo por suscripción.</p></div><div class="g3">${DB.comms.map(c=>{const own=m.ow.includes(c.id);return `<div class="cd"><div class="bn" style="background-image:url('${art(c.a[0],c.a[1],c.id)}')"></div><h3>${E(c.n)}</h3><small>${E(c.o)} · ${c.m} miembros</small><p>${E(c.d)}</p>${own?`<button class="b2" onclick="simsub(${c.id})">Simular suscriptor</button>`:m.subs.includes(c.id)?`<span class="tag">Miembro</span>`:`<button class="b" onclick="sub(${c.id})">${c.p?"Suscribirme · US$"+c.p+"/mes":"Unirme gratis"}</button>`}</div>`}).join("")}</div><div class="cd" style="margin-top:14px"><h3>Crear mi comunidad</h3><input id="cn" placeholder="Nombre de la comunidad"><input id="cp" type="number" min="0" step="0.5" placeholder="Precio mensual en US$ (0 = gratis)"><button class="b" onclick="mk()">Crear comunidad</button></div>`},
games(){const g=ui.g||(ui.g={i:0,s:0});if(g.i>=QZ.length)return `<div class="cd"><h2>Resultado final</h2><p>Acertaste ${g.s} de ${QZ.length} preguntas.</p><button class="b" onclick="ui.g=null;render()">Jugar de nuevo</button></div>`;const q=QZ[g.i];return `<div class="cd"><h2>Trivia bíblica</h2><small>Pregunta ${g.i+1} de ${QZ.length} · ${g.s} puntos</small><div class="bar" style="margin-top:6px"><i style="width:${g.i/QZ.length*100}%"></i></div><h3 style="margin-top:16px">${q[0]}</h3>${q[1].map((o,j)=>`<button class="b2 op" onclick="ans(${j})">${o}</button>`).join("")}</div>`},
market(){return `<div class="cd"><h2>Mercado cristiano</h2><div class="row"><span class="tr">${I("shield")} Vendedores verificados</span><span class="tr">${I("lock")} Pago protegido</span><span class="tr">${I("check")} Devolución en 7 días</span></div></div><div class="g3">${DB.prods.map(p=>`<div class="cd"><div class="mw"><img src="${p.img}" alt="" style="margin:0"></div><h3 style="margin-top:8px">${E(p.n)}</h3><small>${E(p.s)} · ${p.vf?"verificado":"verificación pendiente"}</small><p><b>US$${p.p}</b></p><button class="b" onclick="buy(${p.id})">Comprar</button></div>`).join("")}</div><div class="cd" style="margin-top:14px"><h3>Vender un producto</h3><input id="mn" placeholder="Nombre del producto"><input id="mp" type="number" min="1" placeholder="Precio en US$"><div class="row"><button class="b2" onclick="pick(d=>{ui.pi=d;toast('Imagen cargada')})">${I("img")} Foto del producto</button><button class="b" onclick="sell()">Publicar producto</button></div></div>`},
money(){const m=me(),mine=DB.posts.filter(p=>p.uid==m.id),f=40+30*mine.length+5*mine.reduce((a,p)=>a+p.l,0)+m.fx,
R=[["Al menos 500 seguidores ("+f+")",f>=500,Math.min(100,f/5)],["Mínimo 3 publicaciones ("+mine.length+")",mine.length>=3,Math.min(100,mine.length/3*100)],["Sin faltas registradas",!m.f,m.f?0:100],["Correo verificado",1,100],["Normas aceptadas",1,100]],ok=R.every(r=>r[1]),e=m.earn,t=e.tips+e.subs+e.sales;
return `<div class="cd"><h2>Monetización</h2><p class="mu">Cumple los requisitos para ganar con suscripciones, propinas y ventas.</p>${R.map(r=>`<div class="rq"><span style="color:${r[1]?"var(--ok)":"var(--mu)"}">${I(r[1]?"check":"x")}</span><span>${r[0]}</span><div class="bar"><i style="width:${r[2]}%"></i></div></div>`).join("")}<div class="row" style="margin-top:14px">${m.mon?`<span class="tag">Monetización activa</span>`:`<button class="b" ${ok?"":"disabled"} onclick="me().mon=1;save();render()">Activar monetización</button>`}<button class="b2" onclick="me().fx+=100;save();render()">Simular +100 seguidores</button></div></div>`+(m.mon?`<div class="cd"><h3>Ingresos del mes</h3><h1>US$${t.toFixed(2)}</h1><p class="mu">Suscripciones US$${e.subs.toFixed(2)} · Propinas US$${e.tips.toFixed(2)} · Ventas US$${e.sales.toFixed(2)}</p></div>`:"")+`<div class="g3">${[["users","Suscripciones","Cobra mensualidades a tu comunidad."],["live","Propinas en vivo","Recibe apoyo en tus transmisiones."],["store","Mercado","Vende productos cristianos."],["lock","Contenido exclusivo","Publica solo para suscriptores."]].map(x=>`<div class="cd">${I(x[0])}<h3 style="margin-top:6px">${x[1]}</h3><p class="mu">${x[2]}</p></div>`).join("")}</div>`},
norms(){const m=me();return `<div class="cd"><h2>Normas y lineamientos de la comunidad</h2>${["Respeta a todas las personas: sin insultos, burlas ni acoso.","No publiques contenido sexual, violento ni que promueva el odio.","No compartas información falsa ni estafas. Las ventas deben ser honestas.","Protege a los menores: todo contenido que los ponga en riesgo se elimina.","Respeta los derechos de autor y las licencias de música.","Una cuenta por persona. Crear cuentas para evadir sanciones está prohibido.","No uses la fe para pedir dinero de forma engañosa."].map(r=>`<p class="tr" style="color:var(--ink)">${I("check")} ${r}</p>`).join("")}</div><div class="cd"><h3>Sanciones</h3><table><tr><th>Situación</th><th>Resultado</th></tr><tr><td>3 faltas</td><td>Suspensión de 1 mes</td></tr><tr><td>3 faltas más</td><td>Suspensión de 3 meses</td></tr><tr><td>3 faltas más</td><td>Suspensión de 6 meses</td></tr><tr><td>3 faltas más</td><td>Suspensión de 1 año</td></tr><tr><td>Reincidir tras 1 año, o falta grave</td><td>Cuenta eliminada. Correo y dispositivo bloqueados</td></tr></table></div><div class="cd"><h3>Probar el sistema</h3><p class="mu">Tus faltas: ${[0,1,2].map(i=>`<span class="dt ${i<m.f%3?"f":""}"></span>`).join("")}</p><div class="row"><button class="b2" onclick="strike(1,'actividad de prueba')">Registrar falta leve</button><button class="b2" onclick="strike(2,'actividad de prueba')">Falta grave (elimina tu cuenta)</button></div></div>`},
profile(){const m=me(),n=DB.posts.filter(p=>p.uid==m.id).length;return `<div class="cd"><div class="bn" style="background-image:url('${m.bn||art("#1F3A5F","#F2B544",3)}')"><button class="b2" onclick="pick(d=>{me().bn=d;save();render()})">Cambiar banner</button></div>${m.av?`<img class="av big" src="${m.av}" alt="">`:`<div class="av big">${E(m.n[0]).toUpperCase()}</div>`}<div class="row" style="margin:6px 0 10px"><h2 style="margin:0">${E(m.n)}</h2><button class="b2" onclick="pick(d=>{me().av=d;save();render()})">Cambiar foto</button></div><textarea rows="2" placeholder="Escribe tu biografía" onchange="me().bio=this.value;save()">${E(m.bio)}</textarea><p class="mu">${n} publicaciones · ${m.subs.length+m.ow.length} comunidades · ${m.e}</p><p class="mu">Faltas ${[0,1,2].map(i=>`<span class="dt ${i<m.f%3?"f":""}"></span>`).join("")}</p><button class="b2" onclick="out()">Cerrar sesión</button></div>`}};
function render(){const m=me();if(!m){H.innerHTML=auth();return}
H.innerHTML=`<header class="hd">${logo(38)}<b>Selah</b><span style="flex:1"></span>${av(m.n,m.av)}</header><div class="w"><nav class="nv">${NAV.map(n=>`<button class="${V==n[0]?"on":""}" onclick="go('${n[0]}')">${I(n[1])}<span>${n[2]}</span></button>`).join("")}</nav><main>${VIEWS[V]()}</main><aside><div class="cd"><h3>Espacio de confianza</h3>${[["shield","Moderación activa y normas claras"],["lock","Pagos protegidos"],["users","Comunidades verificadas"]].map(x=>`<p class="tr">${I(x[0])} ${x[1]}</p>`).join("")}</div><div class="cd"><h3>Comunidades sugeridas</h3>${DB.comms.slice(0,3).map(c=>`<p><b>${E(c.n)}</b><br><small>${c.m} miembros</small></p>`).join("")}</div></aside></div>`;
const v=$("#lv");if(v&&stream)v.srcObject=stream}
render();
</script></body></html>
